services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bumpa-api
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      HTTP_PORT: 8081
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bumpa
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: bumpa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bumpa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bumpa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
